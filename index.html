<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart dé Jong</title>
<style>
:root{--bg:#0f0e17;--fg:#f4f3ff;--dim:#8d8aa8;--card:#1a1930;--ac:#9d86ff;--bd:#2c2a47}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#bgv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.ov{position:fixed;inset:0;background:rgba(15,14,23,.6);z-index:-1}
@media (max-aspect-ratio:1/1){#bgv{object-fit:contain}}
header{padding:16px;text-align:center;border-bottom:1px solid var(--bd)}
.brand{color:var(--fg);text-decoration:none;font-weight:800;font-size:20px;letter-spacing:.5px}
main{max-width:560px;margin:0 auto;padding:16px}
a{color:var(--ac)}.dim{color:var(--dim);text-decoration:none;font-size:14px}
h1{font-size:24px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:6px}
.card small{color:var(--dim)}
.cov{aspect-ratio:1;border-radius:10px;background:var(--bd) center/cover;display:grid;place-items:center;font-size:32px}
.art{width:100%;max-height:300px;object-fit:cover;border-radius:14px}
#ly{height:42vh;overflow-y:auto;text-align:center;padding:18vh 0;margin:8px 0}
.ln{font-size:22px;font-weight:700;padding:7px 0;color:var(--dim);opacity:.5;transition:.3s}
.ln.on{color:var(--fg);opacity:1;transform:scale(1.05)}
.bar{position:sticky;bottom:0;background:rgba(15,14,23,.85);padding:8px 0}
.row{display:flex;gap:8px;justify-content:space-between;font-size:12px;color:var(--dim);margin:4px 0}
.bar .row:last-child{justify-content:center;font-size:16px}
input[type=range]{width:100%;accent-color:var(--ac)}
button{background:var(--ac);color:#0f0e17;border:0;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--ac)}
input,textarea{width:100%;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:10px;font:15px inherit;margin:4px 0 10px}
textarea{height:150px}label{font-size:13px;color:var(--dim)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
#tp{width:100%;padding:20px;font-size:18px;margin-top:8px}
audio{width:100%}
#fx{max-height:50vh;overflow-y:auto}#fx button{padding:6px 12px;font-size:14px;margin-left:4px}#fx .item{gap:8px}
select{width:100%;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:10px;font:15px inherit;margin:4px 0 10px}
</style>
</head>
<body>
<video id="bgv" src="bg.mp4" autoplay muted loop playsinline preload="auto" onerror="this.remove()"></video><div class="ov"></div>
<header><a href="#" class="brand">Smart dé Jong</a></header>
<main id="v"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://fpcpnaezqpovmhfubumw.supabase.co';
const SB_KEY='sb_publishable_aWS3qZNPM_kKluNO0_jYzw_3PTeH51e';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),v=$('#v');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.max(0,s||0);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')};
let au=null;
function parse(t){const o=[];t.split(/\r?\n/).forEach(r=>{const l=r.trim();if(!l)return;const m=l.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);if(m)o.push({t:+m[1]*60+parseFloat(m[2]),text:m[3]||'♪'});else if(!/^\[[a-z]+:/i.test(l))o.push({t:null,text:l})});return o}
function route(){if(au){au.pause();au=null}const h=location.hash;if(h.startsWith('#song='))song(h.slice(6));else if(h==='#admin')admin();else home()}
addEventListener('hashchange',route);route();

async function home(){
  v.innerHTML='<p class="dim">Loading…</p>';
  const {data,error}=await sb.from('songs').select('id,title,cover_url,plays').order('created_at',{ascending:false});
  if(error)return v.innerHTML='<p>Could not load songs. Please refresh.</p>';
  v.innerHTML=data.length?'<div class="grid">'+data.map(s=>`<a class="card" href="#song=${s.id}"><div class="cov" style="background-image:url('${esc(s.cover_url||'')}')">${s.cover_url?'':'🎵'}</div><b>${esc(s.title)}</b><small>▶ ${s.plays}</small></a>`).join('')+'</div>':'<p class="dim">No songs yet. Check back soon!</p>';
}

async function song(id){
  v.innerHTML='<p class="dim">Loading…</p>';
  const {data:s,error}=await sb.from('songs').select('*').eq('id',id).single();
  if(error||!s)return v.innerHTML='<p>Song not found.</p><a href="#">← All songs</a>';
  const L=s.lyrics||[];
  v.innerHTML=`<a href="#" class="dim">← All songs</a>${s.cover_url?`<img class="art" src="${esc(s.cover_url)}" alt="">`:''}<h1>${esc(s.title)}</h1>
  <div id="ly">${L.map(l=>`<div class="ln">${esc(l.text)}</div>`).join('')}</div>
  <div class="bar"><input type="range" id="sk" min="0" max="100" step="0.1" value="0"><div class="row"><span id="cu">0:00</span><span id="du">0:00</span></div>
  <div class="row"><button id="pl">▶ Play</button><button id="dl" class="ghost">⬇ Download</button></div></div>`;
  au=new Audio(s.audio_url);let act=-1,counted=false;
  au.onloadedmetadata=()=>{$('#sk').max=au.duration;$('#du').textContent=fmt(au.duration)};
  au.onplay=()=>{$('#pl').textContent='⏸ Pause';if(!counted){counted=true;sb.rpc('bump_plays',{song_id:id})}};
  au.onpause=()=>$('#pl').textContent='▶ Play';
  au.ontimeupdate=()=>{$('#sk').value=au.currentTime;$('#cu').textContent=fmt(au.currentTime);let i=-1;L.forEach((l,k)=>{if(l.t!=null&&l.t<=au.currentTime)i=k});if(i!==act){act=i;[...$('#ly').children].forEach((e,k)=>e.classList.toggle('on',k===i));if(i>=0)$('#ly').children[i].scrollIntoView({block:'center',behavior:'smooth'})}};
  $('#pl').onclick=()=>au.paused?au.play():au.pause();
  $('#sk').oninput=e=>au.currentTime=+e.target.value;
  $('#dl').onclick=async e=>{const b=e.target;b.textContent='Downloading…';
    try{const bl=await (await fetch(s.audio_url)).blob();const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=s.title.replace(/[^\w\- ]+/g,'')+'.'+(s.audio_url.split('.').pop().split('?')[0]||'mp3');document.body.appendChild(a);a.click();a.remove();sb.rpc('bump_downloads',{song_id:id});b.textContent='✓ Downloaded'}
    catch(x){window.open(s.audio_url,'_blank');b.textContent='⬇ Download'}};
}

async function admin(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){
    v.innerHTML=`<h1>Artist login</h1><label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password"><button id="lg">Log in</button><p id="er" class="dim"></p>`;
    $('#lg').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)$('#er').textContent='Wrong email or password.';else admin()};
    return;
  }
  const {data:songs}=await sb.from('songs').select('id,title,plays,downloads').order('created_at',{ascending:false});
  let lines=[],ti=0;
  v.innerHTML=`<div class="row" style="font-size:14px"><b style="color:var(--fg)">Add a song</b><a href="#" id="lo">Log out</a></div>
  <div class="box"><label>Title</label><input id="ti"><label>Audio file (mp3, m4a, wav)</label><input id="fa" type="file"><label>Cover image (optional)</label><input id="fc" type="file" accept="image/*">
  <label>Lyrics (plain text, or LRC with [00:12.50] timestamps)</label><textarea id="lr"></textarea>
  <label>Auto-sync quality</label><select id="md"><option value="Xenova/whisper-tiny">Fast (smaller download)</option><option value="Xenova/whisper-base">Better (larger download)</option></select>
  <button id="au2" style="margin-right:8px">✨ Auto-sync</button><button class="ghost" id="sy">Tap to sync</button>
  <div id="sp" style="display:none;margin-top:10px"><audio id="pa" controls></audio><div id="tu" style="display:none"><p id="nx" class="dim"></p><button id="tp">TAP when this line starts</button></div><div id="fx"></div></div>
  <p id="st" class="dim"></p><button id="up">Upload song</button></div>
  <div class="box"><b>Your songs</b>${(songs||[]).map(s=>`<div class="item"><span>${esc(s.title)}<br><small class="dim">▶ ${s.plays} · ⬇ ${s.downloads}</small></span><button class="ghost" data-d="${s.id}">Delete</button></div>`).join('')||'<p class="dim">None yet.</p>'}</div>`;
  $('#lo').onclick=async e=>{e.preventDefault();await sb.auth.signOut();admin()};
  $('#fa').onchange=e=>{if(e.target.files[0])$('#pa').src=URL.createObjectURL(e.target.files[0])};
  const fix=()=>{$('#sp').style.display='block';
    $('#fx').innerHTML='<p class="dim">Fix timing: − / + moves a line 0.5s, ▶ plays from that line.</p>'+lines.map((l,i)=>`<div class="item"><span><small class="dim">${(l.t||0).toFixed(1)}s</small> ${esc(l.text)}</span><span style="white-space:nowrap"><button class="ghost" data-f="${i}:-0.5">−</button><button class="ghost" data-f="${i}:0.5">+</button><button class="ghost" data-p="${i}">▶</button></span></div>`).join('');
    $('#fx').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{const [i,d]=b.dataset.f.split(':');lines[i].t=Math.max(0,(lines[i].t||0)+parseFloat(d));fix()});
    $('#fx').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{$('#pa').currentTime=Math.max(0,(lines[b.dataset.p].t||0)-0.3);$('#pa').play()})};
  const norm=s=>s.toLowerCase().normalize('NFD').replace(/[^\p{L}\p{N}]/gu,'');
  const sim=(a,b)=>a===b?3:((a.length>2&&b.length>2&&(a.startsWith(b)||b.startsWith(a)))?1:-1);
  function alignLines(chunks){
    const W=chunks.map(c=>({w:norm(c.text),t:c.timestamp[0]})).filter(x=>x.w&&x.t!=null);
    const L=[];lines.forEach((l,i)=>l.text.split(/\s+/).forEach(w=>{const n=norm(w);if(n)L.push({w:n,i})}));
    const n=L.length,m=W.length;if(!n||!m)throw new Error('Could not hear any words');
    const M=m+1,S=new Int32Array((n+1)*M),D=new Uint8Array((n+1)*M);
    for(let i=1;i<=n;i++){S[i*M]=-i;D[i*M]=1}
    for(let j=1;j<=m;j++){S[j]=-j;D[j]=2}
    for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){
      const d=S[(i-1)*M+j-1]+sim(L[i-1].w,W[j-1].w),u=S[(i-1)*M+j]-1,l=S[i*M+j-1]-1;
      if(d>=u&&d>=l){S[i*M+j]=d;D[i*M+j]=0}else if(u>=l){S[i*M+j]=u;D[i*M+j]=1}else{S[i*M+j]=l;D[i*M+j]=2}
    }
    const T=new Array(lines.length).fill(null);let i=n,j=m;
    while(i>0||j>0){const d=D[i*M+j];
      if(d===0){if(sim(L[i-1].w,W[j-1].w)>0)T[L[i-1].i]=W[j-1].t;i--;j--}else if(d===1)i--;else j--}
    const kn=T.map((t,x)=>t!=null?x:-1).filter(x=>x>=0);
    if(!kn.length)throw new Error('Could not match the words. Check the lyrics');
    for(let x=0;x<T.length;x++){if(T[x]!=null)continue;
      const p=[...kn].reverse().find(k=>k<x),q=kn.find(k=>k>x);
      if(p!=null&&q!=null)T[x]=T[p]+(T[q]-T[p])*(x-p)/(q-p);else if(p!=null)T[x]=T[p]+3*(x-p);else T[x]=Math.max(0,T[q]-3*(q-x))}
    for(let x=1;x<T.length;x++)if(T[x]<T[x-1])T[x]=T[x-1];
    lines.forEach((l,x)=>l.t=Math.max(0,Math.round((T[x]-0.15)*100)/100));
  }
  const show=()=>{$('#nx').textContent=ti<lines.length?`Next line (${ti+1}/${lines.length}): ${lines[ti].text}`:'All lines synced ✓ fix any line below.';if(ti>=lines.length)fix()};
  $('#au2').onclick=async()=>{
    const f=$('#fa').files[0];if(!f)return alert('Choose the audio first.');
    lines=parse($('#lr').value);if(!lines.length)return alert('Add lyrics first.');
    const st=$('#st');if(lines.every(l=>l.t!=null)){st.textContent='Timestamps found ✓';fix();return}
    $('#au2').disabled=true;$('#tu').style.display='none';
    try{
      const id=$('#md').value;
      if(!window.asrP||window.asrId!==id){window.asrId=id;st.textContent='Loading the AI model…';
        const T=await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');T.env.allowLocalModels=false;
        window.asrP=T.pipeline('automatic-speech-recognition',id,{progress_callback:p=>{if(p.status==='progress')st.textContent='Downloading AI model… '+Math.round(p.progress)+'% (first time only)'}})}
      const asr=await window.asrP;
      st.textContent='Reading the song…';
      const ctx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
      const buf=await ctx.decodeAudioData(await f.arrayBuffer());const a=buf.getChannelData(0);
      st.textContent='Listening to the song… this can take a few minutes. Keep this page open.';
      const out=await asr(a,{chunk_length_s:30,stride_length_s:5,return_timestamps:'word'});
      alignLines(out.chunks);
      st.textContent='Auto-sync done ✓ Play it and fix any line below.';fix();
    }catch(e){console.error(e);window.asrP=null;st.textContent='Auto-sync failed: '+(e.message||e)+'. Try Fast quality, or use Tap to sync.'}
    $('#au2').disabled=false};
  $('#sy').onclick=()=>{if(!$('#fa').files[0])return alert('Choose the audio first.');lines=parse($('#lr').value);if(!lines.length)return alert('Add lyrics first.');
    if(lines.every(l=>l.t!=null)){$('#st').textContent='Timestamps found ✓ no tapping needed.';fix();return}
    lines.forEach(l=>l.t=null);ti=0;$('#sp').style.display='block';$('#tu').style.display='block';$('#fx').innerHTML='';show()};
  $('#tp').onclick=()=>{if(ti<lines.length){lines[ti].t=$('#pa').currentTime;ti++;show()}};
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this song?')){await sb.from('songs').delete().eq('id',b.dataset.d);admin()}});
  const put=async(f,dir)=>{const n=dir+'/'+Date.now()+'-'+f.name.replace(/[^\w.\-]+/g,'_');const {error}=await sb.storage.from('media').upload(n,f,{contentType:f.type||undefined});if(error)throw error;return sb.storage.from('media').getPublicUrl(n).data.publicUrl};
  $('#up').onclick=async()=>{
    const title=$('#ti').value.trim(),f=$('#fa').files[0],c=$('#fc').files[0];
    if(!title||!f)return alert('Title and audio are required.');
    if(!lines.length)lines=parse($('#lr').value);
    if(lines.some(l=>l.t==null)){const d=$('#pa').duration||0;lines.forEach((l,i)=>l.t=d?i/lines.length*d:null)}
    $('#up').disabled=true;$('#st').textContent='Uploading… please wait.';
    try{const a=await put(f,'audio'),cv=c?await put(c,'covers'):null;
      const {error}=await sb.from('songs').insert({title,audio_url:a,cover_url:cv,lyrics:lines});if(error)throw error;
      alert('Song published!');admin()}
    catch(e){$('#st').textContent='Upload failed: '+(e.message||e);$('#up').disabled=false}
  };
}
</script>
</body>
</html>
